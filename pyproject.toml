[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usemeup"
version = "0.1.0"
description = "A local Claude usage dashboard that can prove its own numbers: rate-limit windows, burn-rate projection, and a verifier that recounts from raw transcripts."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Wilton Blake" }]
keywords = ["claude", "anthropic", "usage", "tokens", "rate-limit", "dashboard", "cost"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Utilities",
]

# Standard library only, on purpose. Nothing to audit but this repo.
dependencies = []

[project.urls]
Homepage = "https://github.com/wiltonblake85/usemeup"
Issues = "https://github.com/wiltonblake85/usemeup/issues"

[project.scripts]
usemeup = "usemeup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usemeup = ["index.html", "pricing.json"]
