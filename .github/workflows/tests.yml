name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor the README promises.
          - { os: ubuntu-latest, python: "3.9" }
          # The newest release.
          - { os: ubuntu-latest, python: "3.13" }
          # What the Mac app bundles: Homebrew python3.12 on Apple silicon.
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pytest is the only thing installed; the package itself has no dependencies.
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
